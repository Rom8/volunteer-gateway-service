spring:
  application:
    name: volunteer-gateway-service
  security:
    oauth2:
      client:
        registration:
          yandex:
            provider: yandex
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/yandex
            authorization-grant-type: authorization_code
            client-name: Yandex
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: default_email
clients:
  volunteer-service:
    base-url: http://localhost:8101   #todo использовать  Service Discovery - eureka
