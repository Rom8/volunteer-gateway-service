<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница волонтёра</title>
    <link rel="stylesheet" th:href="@{/css/volunteer-home.css}">
</head>
<body>
<header class="volunteer-header">
    <form class="logout-form" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="logout-button" type="submit">Выйти</button>
    </form>
</header>

<main class="volunteer-page" aria-labelledby="volunteer-title">
    <section class="volunteer-card">
        <p class="volunteer-card__eyebrow">Личный кабинет волонтёра</p>
        <h1 id="volunteer-title" class="volunteer-card__title">
            Добро пожаловать, <span th:text="${volunteerName}">волонтёр</span>!
        </h1>
        <p class="volunteer-card__description">
            Здесь будет главная рабочая область для координации помощи и участия в поисковых задачах.
        </p>
        <a class="primary-button primary-button--link" th:href="@{/volunteers/me}">Посмотреть личные данные</a>
    </section>
</main>
</body>
</html>
