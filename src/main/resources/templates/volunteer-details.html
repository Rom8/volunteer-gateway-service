<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Данные волонтёра</title>
    <link rel="stylesheet" th:href="@{/css/volunteer-registration.css}">
</head>
<body>
<header class="volunteer-header">
    <form class="logout-form" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="logout-button" type="submit">Выйти</button>
    </form>
</header>

<main class="volunteer-registration-page" aria-labelledby="volunteer-details-title">
    <section class="volunteer-panel">
        <p class="volunteer-panel__eyebrow">Профиль волонтёра</p>
        <h1 id="volunteer-details-title" class="volunteer-panel__title">Данные волонтёра</h1>
        <p class="volunteer-panel__description">
            Личная информация волонтёра
        </p>

        <dl class="volunteer-details">
            <div class="volunteer-details__row">
                <dt>Фамилия</dt>
                <dd th:text="${volunteer.familyName}">Иванов</dd>
            </div>
            <div class="volunteer-details__row">
                <dt>Имя</dt>
                <dd th:text="${volunteer.firstName}">Иван</dd>
            </div>
            <div class="volunteer-details__row">
                <dt>Отчество</dt>
                <dd th:text="${volunteer.patronymic}">Иванович</dd>
            </div>
            <div class="volunteer-details__row">
                <dt>Пол</dt>
                <dd th:text="${volunteer.gender.name() == 'MALE' ? 'Мужской' : 'Женский'}">Мужской</dd>
            </div>
            <div class="volunteer-details__row">
                <dt>Телефон</dt>
                <dd th:text="${volunteer.phoneNumber}">+7 999 123-45-67</dd>
            </div>
            <div class="volunteer-details__row">
                <dt>Email</dt>
                <dd th:text="${volunteer.email}">volunteer@example.com</dd>
            </div>
            <div class="volunteer-details__row">
                <dt>Дата рождения</dt>
                <dd th:text="${volunteer.birthDate}">1990-01-01</dd>
            </div>
            <div class="volunteer-details__row">
                <dt>Населённый пункт</dt>
                <dd th:text="${volunteer.residenceSettlement}">Москва</dd>
            </div>
            <div class="volunteer-details__row">
                <dt>Район</dt>
                <dd th:text="${#strings.isEmpty(volunteer.residenceDistrict) ? 'Не указан' : volunteer.residenceDistrict}">
                    Не указан
                </dd>
            </div>
        </dl>

        <div class="volunteer-actions">
            <a class="primary-button primary-button--link" th:href="@{/volunteers/update}">Редактировать данные</a>
            <a class="primary-button primary-button--link" th:href="@{/}">Перейти в личный кабинет</a>
        </div>
    </section>
</main>
</body>
</html>
