services:
  postgres:
    image: postgres:17.10
    container_name: volunteer-gateway-postgres
    environment:
      POSTGRES_DB: volunteer_gateway
      POSTGRES_USER: volunteer_gateway
      POSTGRES_PASSWORD: volunteer_gateway
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - volunteer_gateway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteer_gateway -d volunteer_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  volunteer_gateway_postgres_data:
